[package]
name = "inkdown"
version = "0.1.0"
description = "Inkdown · 本地优先的 Markdown 笔记应用"
authors = ["Inkdown"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "inkdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
opener = "0.7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

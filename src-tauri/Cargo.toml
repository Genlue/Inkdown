[package]
name = "inkdown"
version = "1.0.1"
description = "Inkdown · 本地优先的 Markdown 笔记应用"
authors = ["Inkdown"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "inkdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
opener = "0.7"
glass-design-host = { git = "https://github.com/Genlue/GlassDesign", tag = "v0.9.0" }
# 文件监听：Windows 后端是内置的（ReadDirectoryChangesW），不需要额外 feature；
# macOS 的 FSEvents 是可选后端，必须显式打开，否则 mac 上会退化到轮询。
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

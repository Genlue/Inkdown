[package]
name = "inkdown"
version = "1.0.11"
description = "Inkdown · 本地优先的 Markdown 笔记应用"
authors = ["Inkdown"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "inkdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
opener = "0.7"
# 更新检查只用一个阻塞 HTTP 客户端：走系统证书（Windows 上是 schannel），
# 不额外拖进 rustls 与它的加密后端。
ureq = { version = "3", default-features = false, features = ["native-tls"] }
glass-design-host = { git = "https://github.com/Genlue/GlassDesign", tag = "v0.10.1" }
# 文件监听：Windows 后端是内置的（ReadDirectoryChangesW），不需要额外 feature；
# macOS 的 FSEvents 是可选后端，必须显式打开，否则 mac 上会退化到轮询。
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(windows)'.dependencies]
# 系统字体列表直接读注册表。以前是起 reg query 子进程去查：宿主是 GUI 进程、
# 本身没有控制台，Windows 会给这个控制台子进程新分配一个控制台窗口 —— 表现就是
# 每次打开软件时一闪而过的黑框。读注册表既不会有窗口，也省掉一次进程启动。
winreg = "0.56"

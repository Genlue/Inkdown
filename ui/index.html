<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./assets/inkdown.png" />
  <title>Inkdown</title>
  <style>
    /* 页面高度链归页面自己，防止滚动掉到 window 上 */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: transparent; }
    /* WASM 实例化前的静态过渡屏：不依赖任何主题令牌，纯 HTML/CSS，
       所以从点开 exe 的第一帧起就有内容，而不是白板。 */
    #boot-splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: #f5f5f7; color: #1d1d1f;
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      #boot-splash { background: #111114; color: #e8e8ec; }
    }
    #boot-splash .bs-box { width: 220px; text-align: center; }
    #boot-splash .bs-name { font-size: 20px; font-weight: 600; letter-spacing: .02em; }
    #boot-splash .bs-track {
      position: relative; height: 3px; margin: 18px 0 10px;
      border-radius: 99px; background: currentColor; opacity: .12; overflow: hidden;
    }
    #boot-splash .bs-track i {
      position: absolute; top: 0; bottom: 0; width: 35%;
      border-radius: 99px; background: currentColor;
      animation: bs-slide 1.1s ease-in-out infinite;
    }
    @keyframes bs-slide { from { left: -35%; } to { left: 100%; } }
    #boot-splash .bs-hint { font-size: 11px; opacity: .55; }
  </style>
  <link rel="stylesheet" href="./inkdown-app.css" />
</head>
<body>
  <div id="boot-splash">
    <div class="bs-box">
      <div class="bs-name">Inkdown</div>
      <div class="bs-track"><i></i></div>
      <div class="bs-hint">正在启动…</div>
    </div>
  </div>
  <!-- 玻璃折射底层：使用 GlassDesign 内置的合成渐变壁纸 -->
  <div id="wallpaper" data-source="demo"></div>
  <div id="app"></div>

  <script type="module">
    import init from './pkg/inkdown_ui.js';
    await init();
  </script>

  <!-- 宿主壳层与壁纸接线：Tauri 宿主里自动写 data-shell="host" -->
  <script src="wallpaper.js"></script>
</body>
</html>

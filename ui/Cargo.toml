[package]
name = "inkdown-ui"
version = "1.0.3"
edition = "2021"
rust-version = "1.88"
description = "Inkdown UI · Leptos CSR + GlassDesign"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glass-design = { git = "https://github.com/Genlue/GlassDesign", tag = "v0.10.1" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
  "Document", "Element", "Node", "NodeList", "EventTarget", "Event",
  "Window", "Location", "HtmlElement", "HtmlDivElement", "HtmlInputElement",
  "HtmlTextAreaElement", "HtmlImageElement", "HtmlAnchorElement",
  "DomRect", "DomTokenList", "CssStyleDeclaration", "Storage",
  "KeyboardEvent", "MouseEvent", "PointerEvent", "FocusEvent",
  "DragEvent", "DataTransfer", "ClipboardEvent", "DataTransferItemList",
  "DataTransferItem", "File", "FileList", "FileReader", "Blob",
  "Navigator", "Clipboard", "ScrollToOptions", "ScrollBehavior",
  "MediaQueryList", "WheelEvent", "InputEvent", "Selection", "console",
] }

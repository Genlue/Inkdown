<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./assets/inkdown.png" />
  <script>
    // 桌面端：先把窗口模式挂上，避免首帧看到方角壁纸
    if (window.__TAURI__ && window.__TAURI__.core) {
      document.documentElement.dataset.desktop = '1';
    }
    window.addEventListener('error', function(e) {
      console.error(e);
      var el = document.getElementById('__app_error__');
      if (!el) {
        el = document.createElement('div');
        el.id = '__app_error__';
        el.style.cssText = 'position:fixed;top:40px;left:40px;right:40px;z-index:999999;background:rgba(220,38,38,0.95);color:#fff;padding:20px;border-radius:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 12px 40px rgba(0,0,0,0.5);';
        document.body.appendChild(el);
      }
      el.textContent += '[Error] ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error?.stack || '') + '\n';
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error(e);
      var el = document.getElementById('__app_error__');
      if (!el) {
        el = document.createElement('div');
        el.id = '__app_error__';
        el.style.cssText = 'position:fixed;top:40px;left:40px;right:40px;z-index:999999;background:rgba(220,38,38,0.95);color:#fff;padding:20px;border-radius:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 12px 40px rgba(0,0,0,0.5);';
        document.body.appendChild(el);
      }
      el.textContent += '[Unhandled Promise] ' + (e.reason?.stack || e.reason) + '\n';
    });
  </script>
  <title>Inkdown</title>

  <!-- 顺序不能换：令牌 → 基座 → 布局 → 控件 -->
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/inkdown.css" />
</head>
<body>
  <!-- 壁纸层：窗口是透明的，玻璃材质靠它透出内容 -->
  <div id="wallpaper"></div>

  <div class="l-app" id="app">
    <!-- 顶栏属于窗口，不属于内容列 -->
    <header class="c-topbar" data-drag></header>

    <div class="l-main">
      <div class="ink-split">
        <aside class="ink-list" id="listPane"></aside>
        <section class="ink-doc" id="docPane" data-empty="0"></section>
      </div>
    </div>
  </div>

  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
